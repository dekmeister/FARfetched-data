[project]
name = "farfetched-data"
version = "0.1.0"
description = "Source data and build pipeline for the FARFETCHed cert basis dataset."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-jsonschema>=4.21",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# A complexity ratchet: no function over McCabe 10, 12 branches or 50
# statements. Split a function that hits it; don't add `noqa`.
extend-select = ["C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# `uv run mypy .` also checks tools/ (default strictness); the build, its CLI
# and scripts/ are held to --strict. (`strict` itself is global-only, so its
# flags are listed.)
[[tool.mypy.overrides]]
module = ["build", "certbuild.*", "scripts.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests", "tools/s99_tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: reads or builds the real data/ (deselect with -m \"not slow\")",
]
